# Codex CLI user-level config for the sandbox.
# Rendered to $CODEX_HOME/config.toml on every start; render.py appends a
# [projects."<workspace>"] trust entry so the project's own .codex/ layer loads.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_reasoning_effort = "medium"

# No OS keyring in the container: credentials live in $CODEX_HOME/auth.json (the volume).
cli_auth_credentials_store = "file"
# The image pins the Codex version; a running container must not nag about or drift from it.
check_for_update_on_startup = false

[sandbox_workspace_write]
# The container is the sandbox; agents need the network for pnpm, uv, gh.
network_access = true

[agents]
# Custom roles are auto-discovered from $CODEX_HOME/agents/*.toml (rendered from .ai/agents/).
enabled = true
max_concurrent_threads_per_session = 4

# MCP servers shared by every project go here:
# [mcp_servers.example]
# command = "npx"
# args = ["-y", "some-mcp-server"]
